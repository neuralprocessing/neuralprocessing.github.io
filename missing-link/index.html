  <dialog id="fwDialog" class="small" aria-labelledby="fwDlgTitle">

  <dialog id="wizard" aria-labelledby="wizTitle">
    <header class="wizhead">
      <h2 id="wizTitle" data-i18n="wiz.title"></h2>
      <ol id="wizSteps" class="wizsteps"><li data-i18n="wiz.step0"></li><li data-i18n="wiz.step1"></li><li data-i18n="wiz.step2"></li><li data-i18n="wiz.step3"></li><li data-i18n="wiz.step4"></li></ol>
    </header>
    <div class="wizbody">
      <section class="pane" data-step="0">
        <h3 data-i18n="wiz.s0.title"></h3>
        <label><input type="radio" name="wizMode" value="new" checked><span data-i18n="wiz.s0.new"></span></label>
        <label><input type="radio" name="wizMode" value="device"><span data-i18n="wiz.s0.device"></span>
          <select id="wizProfile" class="cell"></select></label>
        <label><input type="radio" name="wizMode" value="continue"><span data-i18n="wiz.s0.continue"></span> (<span id="wizDraftInfo"></span>)</label>
      </section>
      <section class="pane" data-step="1">
        <h3 data-i18n="wiz.s1.title"></h3>
        <p data-i18n="wiz.s1.text"></p>
        <div class="row"><button id="restBtn" disabled data-i18n="btn.rest" data-i18n-title="tip.rest"></button><span id="restInfo" class="hint"></span></div>
      </section>
      <section class="pane" data-step="2">
        <h3><span data-i18n="wiz.s2.title"></span> (<span id="axCount">0</span>)</h3>
        <p data-i18n-html="wiz.s2.text"></p>
        <div class="btnlayout">
          <div>
            <p id="axGuideInfo" class="hint axguide"></p>
          <div class="fields">
            <div><label for="axKind" data-i18n="ax.kind"></label><select id="axKind"><option value="1" data-i18n="ax.kind.centered"></option><option value="2" data-i18n="ax.kind.oneSided"></option><option value="3" data-i18n="ax.kind.range"></option></select></div>
            <div><label for="axRhino" data-i18n="ax.rhino"></label><select id="axRhino"><option value="0" data-i18n="ax.rhino.none"></option></select></div>
            <div><label for="axNeg" data-i18n="ax.neg"></label><input id="axNeg" type="number" min="0" max="48" value="0"></div>
            <div><label for="axPos" data-i18n="ax.pos"></label><input id="axPos" type="number" min="0" max="48" value="0"></div>
          </div>
          <label><input id="axInvert" type="checkbox"><span data-i18n="ax.invert"></span></label>
          <div class="row"><button id="axisRecBtn" disabled data-i18n-title="tip.axisRec"></button><span id="axisInfo" class="hint"></span></div>
          <canvas id="sweepPlot" height="160"></canvas>
          <label for="axCand" data-i18n="ax.cand"></label><select id="axCand" disabled></select>
          <div id="axAngleRow" hidden>
            <label><input id="axAngle" type="checkbox"><span data-i18n="ax.angle"></span></label><select id="axPartner"></select>
            <p id="axAngleHint" class="hint"></p>
          </div>
          <p id="axCurveInfo" class="hint"></p>
          <div class="actions"><button id="axApplyBtn" class="primary" disabled data-i18n="btn.axApply" data-i18n-title="tip.axApply"></button></div>
          </div>
          <figure class="gripfig" id="axGuideFig"><div id="axFig"></div><figcaption><strong id="axStep"></strong><span class="hint" data-i18n="grip.caption"></span><button id="axSkip" class="mini" data-i18n="btn.skip" data-i18n-title="tip.axSkip"></button></figcaption></figure>
        </div>
        <p class="hint" data-i18n-html="ax.help"></p>
        <div class="tablewrap"><table><tbody id="axTable"></tbody></table></div>
        <h4 data-i18n="zone.title"></h4>
        <p class="hint" data-i18n-html="zone.help"></p>
        <div class="tablewrap"><table><tbody id="zoneTable"></tbody></table></div>
        <div class="actions"><button id="zoneAddBtn" data-i18n="btn.zoneAdd" data-i18n-title="tip.zoneAdd"></button></div>
      </section>
      <section class="pane" data-step="3">
        <h3><span data-i18n="wiz.s3.title"></span> (<span id="btnCount">0</span>)</h3>
        <p class="hint" data-i18n="wiz.s3.text"></p>
        <div class="btnlayout">
          <div>
            <div class="fields">
              <div><label for="gripModel" data-i18n="grip.model"></label><select id="gripModel" data-i18n-title="tip.gripModel"><option value="" data-i18n="grip.none"></option><option value="mcgUltimate" selected>MCG Ultimate</option></select></div>
              <div><label for="btnNext" data-i18n="btn.next"></label><input id="btnNext" type="number" min="1" max="48" value="1"></div>
            </div>
            <div class="actions"><button id="btnLearnBtn" disabled data-i18n-title="tip.learn"></button><button id="btnSkip" hidden data-i18n="btn.skip" data-i18n-title="tip.skip"></button></div>
            <p id="btnInfo" class="hint"></p>
            <div id="btnChoices" class="row"></div>
            <div class="tablewrap"><table><tbody id="btnTable"></tbody></table></div>
          </div>
          <figure class="gripfig"><div id="gripFig"></div><figcaption><strong id="gripStep"></strong><span class="hint" data-i18n="grip.caption"></span><ul class="legend"><li><i class="sw hot"></i><span data-i18n="leg.hot"></span></li><li><i class="sw todo"></i><span data-i18n="leg.todo"></span></li><li><i class="sw red"></i><span data-i18n="leg.red"></span></li><li><i class="sw done"></i><span data-i18n="leg.done"></span></li><li><i class="sw body"></i><span data-i18n="leg.body"></span></li><li><i class="sw alt"></i><span data-i18n="leg.alt"></span></li></ul></figcaption></figure>
        </div>
      </section>
      <section class="pane" data-step="4">
        <h3 data-i18n="wiz.s4.title"></h3>
        <p data-i18n="wiz.s4.text"></p>
        <div class="fields">
          <div><label for="profName" data-i18n="prof.name"></label><input id="profName" maxlength="15" data-i18n-placeholder="prof.namePh"></div>
          <div><label for="profSlot" data-i18n="prof.slotLabel"></label><select id="profSlot"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>
        </div>
        <div class="actions"><button id="testBtn" disabled data-i18n="btn.test" data-i18n-title="tip.test"></button><button id="saveBtn" class="primary" disabled data-i18n="btn.save" data-i18n-title="tip.save"></button></div>
        <div class="actions"><button id="exportBtn" data-i18n="btn.export" data-i18n-title="tip.export"></button><button id="importBtn" data-i18n="btn.import" data-i18n-title="tip.import"></button><button id="resetBtn" data-i18n="btn.reset" data-i18n-title="tip.reset"></button>
          <input id="fileInput" type="file" accept=".mlprofile" hidden></div>
      </section>
      <div class="wizlive">
        <p class="hint" id="wizLiveSource"></p>
        <div class="btngrid" id="wBtnGrid"></div>
        <div id="wAxisBars"></div>
        <div id="wizDemo"></div>
      </div>
    </div>
    <footer class="wizfoot">
      <div id="wizMsg" class="message" role="status"></div>
      <div class="actions">
        <button id="wizCloseBtn" data-i18n-title="tip.wizClose"></button><span class="spacer"></span>

      </div>
    </footer>
