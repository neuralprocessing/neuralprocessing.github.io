<body><div id="layout"><main>
  <div class="top">
    <div><div class="eyebrow">VKB RevC → VPforce Rhino</div><h1 data-i18n="top.h1"></h1><p class="tagline" data-i18n="top.tagline"></p>
      <p data-i18n="top.sub"></p></div>

      <div class="langsw" role="group" data-i18n-title="lang.group">
        <button data-lang="de" aria-pressed="false" data-i18n-title="lang.de"><svg viewBox="0 0 5 3" aria-hidden="true"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#D00"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>DE</button>
        <button data-lang="en" aria-pressed="false" data-i18n-title="lang.en"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="gbclip"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#gbclip)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>EN</button>
      </div>
      <div class="status"><span id="dot" class="dot"></span><span id="connStatus" data-i18n="conn.none"></span></div>
    </div>
  </div>
  <section class="card intro" id="intro">

    <p data-i18n-html="intro.what"></p>
    <div data-i18n-html="intro.tool"></div>
    <p data-i18n-html="intro.needs"></p>
    <p data-i18n-html="intro.start"></p>
    <p class="hint" data-i18n="intro.privacy"></p>
  </section>
  <p class="introtoggle"><button id="introToggle" class="mini"></button></p>
  <div class="grid">
    <section class="card">
      <h2 data-i18n="c1.title"></h2>
      <p data-i18n="c1.text"></p>
      <div class="row"><button id="connectBtn" class="primary" data-i18n="btn.connect" data-i18n-title="tip.connect"></button><button id="demoBtn" data-i18n="btn.demo" data-i18n-title="tip.demo"></button><button id="disconnectBtn" disabled data-i18n="btn.disconnect" data-i18n-title="tip.disconnect"></button></div>
      <div id="message" class="message" role="status"></div>
      <div id="fwWarn" class="fwwarn" role="alert" hidden><strong id="fwWarnTitle"></strong><span id="fwWarnText"></span><button id="fwWarnBtn" class="mini primary" hidden data-i18n="btn.fwNow"></button></div>
      <dl class="kv">
        <dt data-i18n="c2.fw"></dt><dd id="fwVersion">–</dd>
        <dt data-i18n="c2.rhino"></dt><dd><span id="rhinoStats" class="hint"></span><div id="rhinoVerdict" class="hint"></div></dd>
      </dl>
      <div class="actions"><button id="fwBtn" data-i18n="btn.fw" data-i18n-title="tip.fwUpdate"></button></div>
    </section>
    <section class="card">
      <h2 data-i18n="c2.title"></h2>
      <dl class="kv">
        <dt data-i18n="c2.state"></dt><dd><span id="devState" class="badge">–</span> <span id="devCal" class="hint"></span></dd>
        <dt data-i18n="c2.grip"></dt><dd id="devProfile">–</dd>
        <dt data-i18n="c2.polls"></dt><dd id="stats" class="hint"></dd>
        <dt data-i18n="c2.draft"></dt><dd id="draftSummary" class="hint"></dd>
        <dt data-i18n="c2.led" id="ledLabel" hidden></dt><dd id="ledRow" hidden><span class="leddot" id="ledDot"></span><span class="leddot oval" id="ledDot2"></span> <span id="ledText" class="hint"></span></dd>
      </dl>
      <div class="actions"><button id="wizOpenBtn" class="primary" disabled data-i18n="btn.wizOpen" data-i18n-title="tip.wizOpen"></button><button id="detectBtn" disabled data-i18n="btn.detect" data-i18n-title="tip.detect"></button><button id="configBtn" disabled data-i18n="btn.config" data-i18n-title="tip.config"></button></div>
      <h3 data-i18n="c2.profiles"></h3>
      <div id="profileList"></div>
    </section>

    <section class="card wide">

      <div class="livewrap">
        <div><div class="btngrid" id="btnGrid"></div><div id="axisBars"></div></div>

      </div>
    </section>


    <div id="wizHome"></div>
    <div id="demoHome"><section class="card wide" id="demoPanel" hidden>
      <h2 data-i18n="demo.title"></h2>
      <p class="hint" data-i18n="demo.hint"></p>
      <div id="demoGrip" class="lgroups demogrip"></div>
      <div class="row"><label><input id="demoUnknown" type="checkbox"><span data-i18n="demo.unknown"></span></label>
        <label><input id="demoSpring" type="checkbox" checked><span data-i18n="demo.spring"></span></label></div>
    </section></div>

  </div>
</main>
<div id="bottom">
    <section class="card" id="logCard">
      <h2 data-i18n="log.title"></h2>
      <div id="log" class="log"></div>
      <div class="actions"><button id="clearLogBtn" data-i18n="btn.clearLog" data-i18n-title="tip.clearLog"></button></div>
    </section>
  <footer><span data-i18n="footer"></span> · <a href="../site/impressum.html" data-i18n="ft.imprint"></a> ·
    <a href="../site/datenschutz-missing-link.html" data-i18n="ft.privacy"></a> ·
    <button type="button" id="legalBtn" class="linkbtn" data-i18n="ft.legal"></button></footer>
</div>
</div>
  <dialog id="fwDialog" class="small" aria-labelledby="fwDlgTitle">
    <h2 id="fwDlgTitle" data-i18n="fw.dlgTitle"></h2>
    <p id="fwDlgInfo"></p>
    <ol class="fwsteps">
      <li><strong data-i18n="fw.s1"></strong><p class="hint" data-i18n="fw.s1text"></p><button id="fwBootBtn" data-i18n="btn.fwBoot"></button></li>
      <li><strong data-i18n="fw.s2"></strong><p class="hint" data-i18n="fw.s2text"></p><button id="fwWriteBtn" class="primary" data-i18n="btn.fwWrite"></button>
        <p id="fwNoPicker" class="hint warn" hidden data-i18n="fw.noPicker"></p></li>
      <li><strong data-i18n="fw.s3"></strong><p class="hint" data-i18n="fw.s3text"></p></li>
    </ol>
    <p id="fwDlgMsg" class="hint" role="status"></p>
    <p class="hint"><a id="fwDownload" data-i18n="fw.download"></a></p>
    <p class="hint"><a href="firmware/LICENSES.txt" target="_blank" rel="noopener" data-i18n="fw.licenses"></a></p>
    <div class="actions"><button id="fwCloseBtn" data-i18n="btn.fwClose"></button></div>
  </dialog>

  <dialog id="legalDialog" class="small legal" aria-labelledby="legalTitle">
    <h2 id="legalTitle" data-i18n="legal.title"></h2>
    <div data-i18n-html="legal.body"></div>
    <div class="actions"><button id="legalCloseBtn" data-i18n="btn.fwClose"></button></div>
  </dialog>

  <dialog id="wizard" aria-labelledby="wizTitle">
    <header class="wizhead">
      <h2 id="wizTitle" data-i18n="wiz.title"></h2>
      <ol id="wizSteps" class="wizsteps"><li data-i18n="wiz.step0"></li><li data-i18n="wiz.step1"></li><li data-i18n="wiz.step2"></li><li data-i18n="wiz.step3"></li><li data-i18n="wiz.step4"></li></ol>
    </header>
    <div class="wizbody">
      <section class="pane" data-step="0">
        <h3 data-i18n="wiz.s0.title"></h3>
        <label><input type="radio" name="wizMode" value="new" checked><span data-i18n="wiz.s0.new"></span></label>
        <label><input type="radio" name="wizMode" value="device"><span data-i18n="wiz.s0.device"></span>
          <select id="wizProfile" class="cell"></select></label>
        <label><input type="radio" name="wizMode" value="continue"><span data-i18n="wiz.s0.continue"></span> (<span id="wizDraftInfo"></span>)</label>
      </section>
      <section class="pane" data-step="1">
        <h3 data-i18n="wiz.s1.title"></h3>
        <p data-i18n="wiz.s1.text"></p>
        <div class="row"><button id="restBtn" disabled data-i18n="btn.rest" data-i18n-title="tip.rest"></button><span id="restInfo" class="hint"></span></div>
      </section>
      <section class="pane" data-step="2">
        <h3><span data-i18n="wiz.s2.title"></span> (<span id="axCount">0</span>)</h3>
        <p data-i18n-html="wiz.s2.text"></p>
        <div class="btnlayout">
          <div>
            <p id="axGuideInfo" class="hint axguide"></p>
          <div class="fields">
            <div><label for="axKind" data-i18n="ax.kind"></label><select id="axKind"><option value="1" data-i18n="ax.kind.centered"></option><option value="2" data-i18n="ax.kind.oneSided"></option><option value="3" data-i18n="ax.kind.range"></option></select></div>
            <div><label for="axRhino" data-i18n="ax.rhino"></label><select id="axRhino"><option value="0" data-i18n="ax.rhino.none"></option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
            <div><label for="axNeg" data-i18n="ax.neg"></label><input id="axNeg" type="number" min="0" max="48" value="0"></div>
            <div><label for="axPos" data-i18n="ax.pos"></label><input id="axPos" type="number" min="0" max="48" value="0"></div>
          </div>
          <label><input id="axInvert" type="checkbox"><span data-i18n="ax.invert"></span></label>
          <div class="row"><button id="axisRecBtn" disabled data-i18n-title="tip.axisRec"></button><span id="axisInfo" class="hint"></span></div>
          <canvas id="sweepPlot" height="160"></canvas>
          <label for="axCand" data-i18n="ax.cand"></label><select id="axCand" disabled></select>
          <div id="axAngleRow" hidden>
            <label><input id="axAngle" type="checkbox"><span data-i18n="ax.angle"></span></label><select id="axPartner"></select>
            <p id="axAngleHint" class="hint"></p>
          </div>
          <p id="axCurveInfo" class="hint"></p>
          <div class="actions"><button id="axApplyBtn" class="primary" disabled data-i18n="btn.axApply" data-i18n-title="tip.axApply"></button></div>
          </div>
          <figure class="gripfig" id="axGuideFig"><div id="axFig"></div><figcaption><strong id="axStep"></strong><span class="hint" data-i18n="grip.caption"></span><button id="axSkip" class="mini" data-i18n="btn.skip" data-i18n-title="tip.axSkip"></button></figcaption></figure>
        </div>
        <p class="hint" data-i18n-html="ax.help"></p>
        <div class="tablewrap"><table><tbody id="axTable"></tbody></table></div>
        <h4 data-i18n="zone.title"></h4>
        <p class="hint" data-i18n-html="zone.help"></p>
        <div class="tablewrap"><table><tbody id="zoneTable"></tbody></table></div>
        <div class="actions"><button id="zoneAddBtn" data-i18n="btn.zoneAdd" data-i18n-title="tip.zoneAdd"></button></div>
      </section>
      <section class="pane" data-step="3">
        <h3><span data-i18n="wiz.s3.title"></span> (<span id="btnCount">0</span>)</h3>
        <p class="hint" data-i18n="wiz.s3.text"></p>
        <div class="btnlayout">
          <div>
            <div class="fields">
              <div><label for="gripModel" data-i18n="grip.model"></label><select id="gripModel" data-i18n-title="tip.gripModel"><option value="" data-i18n="grip.none"></option><option value="mcgUltimate" selected>MCG Ultimate</option></select></div>
              <div><label for="btnNext" data-i18n="btn.next"></label><input id="btnNext" type="number" min="1" max="48" value="1"></div>
            </div>
            <div class="actions"><button id="btnLearnBtn" disabled data-i18n-title="tip.learn"></button><button id="btnSkip" hidden data-i18n="btn.skip" data-i18n-title="tip.skip"></button></div>
            <p id="btnInfo" class="hint"></p>
            <div id="btnChoices" class="row"></div>
            <div class="tablewrap"><table><tbody id="btnTable"></tbody></table></div>
          </div>
          <figure class="gripfig"><div id="gripFig"></div><figcaption><strong id="gripStep"></strong><span class="hint" data-i18n="grip.caption"></span><ul class="legend"><li><i class="sw hot"></i><span data-i18n="leg.hot"></span></li><li><i class="sw todo"></i><span data-i18n="leg.todo"></span></li><li><i class="sw red"></i><span data-i18n="leg.red"></span></li><li><i class="sw done"></i><span data-i18n="leg.done"></span></li><li><i class="sw body"></i><span data-i18n="leg.body"></span></li><li><i class="sw alt"></i><span data-i18n="leg.alt"></span></li></ul></figcaption></figure>
        </div>
      </section>
      <section class="pane" data-step="4">
        <h3 data-i18n="wiz.s4.title"></h3>
        <p data-i18n="wiz.s4.text"></p>
        <div class="fields">
          <div><label for="profName" data-i18n="prof.name"></label><input id="profName" maxlength="15" data-i18n-placeholder="prof.namePh"></div>
          <div><label for="profSlot" data-i18n="prof.slotLabel"></label><select id="profSlot"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>
        </div>
        <div class="actions"><button id="testBtn" disabled data-i18n="btn.test" data-i18n-title="tip.test"></button><button id="saveBtn" class="primary" disabled data-i18n="btn.save" data-i18n-title="tip.save"></button></div>
        <div class="actions"><button id="exportBtn" data-i18n="btn.export" data-i18n-title="tip.export"></button><button id="importBtn" data-i18n="btn.import" data-i18n-title="tip.import"></button><button id="resetBtn" data-i18n="btn.reset" data-i18n-title="tip.reset"></button>
          <input id="fileInput" type="file" accept=".mlprofile" hidden></div>
      </section>
      <div class="wizlive">
        <p class="hint" id="wizLiveSource"></p>
        <div class="btngrid" id="wBtnGrid"></div>
        <div id="wAxisBars"></div>
        <div id="wizDemo"></div>
      </div>
    </div>
    <footer class="wizfoot">
      <div id="wizMsg" class="message" role="status"></div>
      <div class="actions">
        <button id="wizCloseBtn" data-i18n-title="tip.wizClose"></button><span class="spacer"></span>
        <button id="wizBackBtn" data-i18n="btn.wizBack" data-i18n-title="tip.wizBack"></button><button id="wizNextBtn" class="primary" data-i18n-title="tip.wizNext"></button>
      </div>
    </footer>
  </dialog>
<script type="module" src="app.js"></script>
</body></html>
